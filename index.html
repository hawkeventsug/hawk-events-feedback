<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hawk Events | Your Feedback Matters</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #090909;
    color: #ffffff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.container {
    width: 100%;
    max-width: 430px;
    background: #141414;
    border: 1px solid #b88a2a;
    border-radius: 24px;
    padding: 40px 25px;
    text-align: center;
    box-shadow: 0 15px 50px rgba(0,0,0,0.6);
}

.logo {
    color: #d4a83b;
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 5px;
    margin-bottom: 5px;
}

.tagline {
    color: #c9c9c9;
    font-size: 12px;
    letter-spacing: 3px;
    margin-bottom: 35px;
}

h1 {
    font-family: Georgia, serif;
    font-size: 34px;
    margin: 0 0 15px;
    color: #d4a83b;
}

.intro {
    color: #dddddd;
    line-height: 1.6;
    margin-bottom: 30px;
}

.button {
    display: block;
    width: 100%;
    padding: 18px 15px;
    margin: 15px 0;
    border-radius: 12px;
    text-decoration: none;
    font-weight: bold;
    font-size: 16px;
}

.google {
    background: #d4a83b;
    color: #111111;
}

.whatsapp {
    border: 1px solid #d4a83b;
    color: #ffffff;
    background: transparent;
}

.footer {
    margin-top: 30px;
    color: #888888;
    font-size: 12px;
    letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">HAWK EVENTS</div>

    <h1>Your Feedback Matters</h1>

        Thank you for choosing Hawk Events.

    </p>

    <a class="button google"

       target="_blank">
       ⭐ LEAVE A GOOGLE REVIEW

    <a class="button whatsapp"
       href="https://wa.me/256703143301?text=Hello%20Hawk%20Events%2C%20I%27d%20like%20to%20share%20my%20feedback%20about%20your%20service."
       target="_blank">
       💬 SEND FEEDBACK ON WHATSAPP
    </a>

    </div>

</div><!-- Hawk Events Pages refresh -->
